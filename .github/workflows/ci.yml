
name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Build Docker image
        run: docker build -t factory-fault-tracker:${{ github.sha }} .

      - name: Save Docker image as artifact
        run: |
          docker save factory-fault-tracker:${{ github.sha }} \
            -o "$RUNNER_TEMP/factory-fault-tracker-image.tar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-fault-tracker-image
          path: ${{ runner.temp }}/factory-fault-tracker-image.tar
          retention-days: 7

